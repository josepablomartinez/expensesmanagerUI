html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))

h3,

b,

}

}

.table :is(th, td):last-child {

}

}

  corner-shape: superellipse(1.5);

  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;

  left: 0;

  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {

#widget &gt; svg {

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {

  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

(() =&gt; {

  const icon = (name) =&gt; `&lt;i data-lucide=&quot;${name}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;`;

  function logoMark() {

      &lt;path d=&quot;M12.4 11.6c-1.1 2.5-2.6 7.2-2.8 10.7-.1 2.7 2.1 4.1 6.4 4.1s6.5-1.4 6.4-4.1c-.2-3.5-1.7-8.2-2.8-10.7&quot; fill=&quot;none&quot; stroke=&quot;var(--mh-logo-ink)&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;
      &lt;path d=&quot;M19.3 11.8c2.2-.2 4 .4 5.2 1.7&quot; fill=&quot;none&quot; stroke=&quot;var(--mh-logo-ink)&quot; stroke-width=&quot;1.8&quot; stroke-linecap=&quot;round&quot;/&gt;

  function toolsMarkup() {
    return `&lt;div class=&quot;mh-tools&quot; aria-label=&quot;Global display controls&quot;&gt;
      &lt;button class=&quot;mh-tool mh-currency&quot; aria-label=&quot;Display currency: CRC&quot;&gt;₡&lt;/button&gt;

  function desktopHeader() {
    const order = direction === &#x27;c&#x27;

      &lt;nav class=&quot;mh-main-nav&quot; aria-label=&quot;Primary&quot;&gt;${order}&lt;/nav&gt;

  function mobileTop() {

      &lt;div class=&quot;mh-brand&quot;&gt;&lt;span class=&quot;mh-logo&quot;&gt;${logoMark()}&lt;/span&gt;&lt;span class=&quot;sr-only&quot;&gt;MiHarina&lt;/span&gt;&lt;/div&gt;

  function bottomNav(active) {
    return `&lt;nav class=&quot;mh-bottom-nav&quot; aria-label=&quot;Mobile primary&quot;&gt;
      &lt;button class=&quot;mh-bottom-item ${active === &#x27;home&#x27; ? &#x27;is-active&#x27; : &#x27;&#x27;}&quot;&gt;${icon(&#x27;house&#x27;)}&lt;span&gt;Home&lt;/span&gt;&lt;/button&gt;

      &lt;button class=&quot;mh-bottom-item mh-bottom-add&quot; aria-label=&quot;Add expense&quot;&gt;&lt;span class=&quot;mh-add-mark&quot;&gt;${icon(&#x27;plus&#x27;)}&lt;/span&gt;&lt;span&gt;Add&lt;/span&gt;&lt;/button&gt;

  function expenseFrame({ name, category, time, amount, expenseIcon, note, flagged = false, expanded = false }) {

      &lt;div class=&quot;mh-expense&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;mh-expense-toggle&quot; aria-expanded=&quot;${expanded ? &#x27;true&#x27; : &#x27;false&#x27;}&quot;&gt;

          &lt;span class=&quot;mh-expense-copy&quot;&gt;&lt;span class=&quot;mh-expense-name&quot;&gt;${name}&lt;/span&gt;&lt;span class=&quot;mh-meta&quot;&gt;${category} · ${time}&lt;/span&gt;${flagged ? `&lt;span class=&quot;mh-flag&quot;&gt;${icon(&#x27;copy&#x27;)} Possible duplicate&lt;/span&gt;` : &#x27;&#x27;}&lt;/span&gt;

          &lt;span class=&quot;mh-amount&quot;&gt;${amount}&lt;/span&gt;
          &lt;div class=&quot;mh-expense-actions&quot; aria-label=&quot;Expense actions&quot;&gt;

        &lt;/div&gt;
      &lt;/div&gt;

  function todayExpenseRows(compact = false) {

    let body = &#x27;&#x27;;
    if (direction === &#x27;a&#x27;) {
      body = `&lt;section class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-section-head&quot;&gt;&lt;h2&gt;Today&lt;/h2&gt;&lt;span class=&quot;mh-total&quot;&gt;₡30 510&lt;/span&gt;&lt;/div&gt;${todayExpenseRows(true)}&lt;/section&gt;&lt;section class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-section-head&quot;&gt;&lt;h2&gt;Favorite categories&lt;/h2&gt;&lt;span class=&quot;mh-section-link&quot;&gt;Reports&lt;/span&gt;&lt;/div&gt;${budgetRows()}&lt;/section&gt;${reminderCard()}`;
    } else if (direction === &#x27;b&#x27;) {
      body = `&lt;div class=&quot;mh-grid-equal&quot;&gt;&lt;section class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-section-head&quot;&gt;&lt;h2&gt;Today&lt;/h2&gt;&lt;span class=&quot;mh-total&quot;&gt;₡30 510&lt;/span&gt;&lt;/div&gt;${todayExpenseRows(true)}&lt;/section&gt;&lt;section class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-section-head&quot;&gt;&lt;h2&gt;Favorite categories&lt;/h2&gt;&lt;span class=&quot;mh-section-link&quot;&gt;Reports&lt;/span&gt;&lt;/div&gt;${budgetRows()}&lt;/section&gt;&lt;/div&gt;${reminderCard()}&lt;section class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-section-head&quot;&gt;&lt;h2&gt;Recent expenses&lt;/h2&gt;&lt;/div&gt;${recentExpenseGroups()}&lt;/section&gt;`;
    } else {
      body = `${reviewCallout()}&lt;section class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-section-head&quot;&gt;&lt;h2&gt;Today&lt;/h2&gt;&lt;span class=&quot;mh-total&quot;&gt;₡30 510&lt;/span&gt;&lt;/div&gt;${todayExpenseRows(true)}&lt;/section&gt;&lt;section class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-section-head&quot;&gt;&lt;h2&gt;Favorite categories&lt;/h2&gt;&lt;span class=&quot;mh-section-link&quot;&gt;Reports&lt;/span&gt;&lt;/div&gt;${budgetRows()}&lt;/section&gt;`;
    }
    return `&lt;div class=&quot;mh-mobile-wrap&quot;&gt;&lt;div class=&quot;mh-product mh-mobile&quot;&gt;${mobileTop()}&lt;main class=&quot;mh-content&quot;&gt;&lt;h1 class=&quot;mh-page-title&quot;&gt;Good morning, Jose&lt;/h1&gt;&lt;p class=&quot;mh-subtitle&quot;&gt;Friday, August 29&lt;/p&gt;&lt;div class=&quot;mh-stack&quot; style=&quot;margin-top:16px&quot;&gt;${body}&lt;/div&gt;&lt;/main&gt;${bottomNav(&#x27;home&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
  }

  function reviewCard(name, confidence, selected, flagged = false) {
    return `&lt;article class=&quot;mh-review-card&quot;&gt;&lt;div class=&quot;mh-review-card-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;mh-expense-name&quot;&gt;${name}&lt;/div&gt;&lt;div class=&quot;mh-meta&quot;&gt;Aug 29 · ₡${name === &#x27;Ferretería EPA&#x27; ? &#x27;3 450&#x27; : &#x27;2 417&#x27;}&lt;/div&gt;${flagged ? `&lt;span class=&quot;mh-flag&quot;&gt;${icon(&#x27;copy&#x27;)} Possible duplicate&lt;/span&gt;` : &#x27;&#x27;}&lt;/div&gt;&lt;span class=&quot;mh-confidence&quot;&gt;${confidence}% confident&lt;/span&gt;&lt;/div&gt;&lt;select class=&quot;mh-field&quot; aria-label=&quot;Category&quot;&gt;&lt;option&gt;${selected || &#x27;Choose category&#x27;}&lt;/option&gt;&lt;/select&gt;&lt;div class=&quot;mh-review-actions&quot;&gt;&lt;label class=&quot;mh-check&quot;&gt;&lt;input type=&quot;checkbox&quot;&gt; Always&lt;/label&gt;&lt;button class=&quot;mh-action mh-primary&quot;&gt;Approve&lt;/button&gt;&lt;/div&gt;&lt;/article&gt;`;
  }

  function mobileReview() {
    const intro = direction === &#x27;c&#x27;
      ? `&lt;div class=&quot;mh-alert&quot;&gt;&lt;span&gt;${icon(&#x27;sparkles&#x27;)}&lt;/span&gt;&lt;div class=&quot;mh-alert-copy&quot;&gt;&lt;div class=&quot;mh-alert-title&quot;&gt;Two suggestions are ready&lt;/div&gt;&lt;div class=&quot;mh-alert-time&quot;&gt;Confirm or change each category&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;`
      : &#x27;&#x27;;
    return `&lt;div class=&quot;mh-mobile-wrap&quot;&gt;&lt;div class=&quot;mh-product mh-mobile&quot;&gt;${mobileTop()}&lt;main class=&quot;mh-content&quot;&gt;&lt;div class=&quot;mh-mobile-review-head&quot;&gt;&lt;div&gt;&lt;h1 class=&quot;mh-page-title&quot;&gt;Review queue&lt;/h1&gt;&lt;p class=&quot;mh-subtitle&quot;&gt;3 pending&lt;/p&gt;&lt;/div&gt;&lt;button class=&quot;mh-action&quot;&gt;Approve all&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;mh-stack&quot;&gt;${intro}${reviewCard(&#x27;Ferretería EPA&#x27;, 32, &#x27;Otros / Donaciones&#x27;)}${reviewCard(&#x27;Cobro administración&#x27;, 15, &#x27;Apto2 / Mantenimiento&#x27;, true)}${reviewCard(&#x27;Cobro administración&#x27;, 0, &#x27;&#x27;)}&lt;/div&gt;&lt;/main&gt;${bottomNav(&#x27;review&#x27;)}&lt;/div&gt;&lt;/div&gt;`;
  }

  function alertsView() {
    const directionNote = direction === &#x27;a&#x27; ? &#x27;Compact drawer&#x27; : direction === &#x27;b&#x27; ? &#x27;Context-rich panel&#x27; : &#x27;Action-oriented center&#x27;;
    return `&lt;div class=&quot;mh-product&quot;&gt;&lt;div class=&quot;mh-alerts-layout&quot;&gt;&lt;div class=&quot;mh-alerts-backdrop&quot;&gt;${desktopHeader()}&lt;div style=&quot;padding:30px&quot;&gt;&lt;h1 class=&quot;mh-page-title&quot;&gt;Home&lt;/h1&gt;&lt;div class=&quot;mh-muted-block&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mh-muted-block short&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mh-grid-equal&quot;&gt;&lt;div class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-muted-block&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mh-muted-block short&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mh-panel&quot;&gt;&lt;div class=&quot;mh-muted-block&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mh-muted-block short&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;aside class=&quot;mh-alerts-panel&quot;&gt;&lt;div class=&quot;mh-section-head&quot;&gt;&lt;h2&gt;Alerts&lt;/h2&gt;&lt;span class=&quot;mh-count&quot;&gt;2&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;mh-subtitle&quot; style=&quot;margin-bottom:16px&quot;&gt;${directionNote}&lt;/p&gt;&lt;div class=&quot;mh-stack&quot;&gt;${reminderCard()}&lt;div class=&quot;mh-alert is-danger&quot;&gt;&lt;span&gt;${icon(&#x27;copy&#x27;)}&lt;/span&gt;&lt;div class=&quot;mh-alert-copy&quot;&gt;&lt;div class=&quot;mh-alert-title&quot;&gt;Possible duplicate&lt;/div&gt;&lt;div class=&quot;mh-alert-time&quot;&gt;Uber · ₡4 250 · today&lt;/div&gt;&lt;span class=&quot;mh-section-link&quot;&gt;Open expense&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mh-alert&quot;&gt;&lt;span&gt;${icon(&#x27;gauge&#x27;)}&lt;/span&gt;&lt;div class=&quot;mh-alert-copy&quot;&gt;&lt;div class=&quot;mh-alert-title&quot;&gt;Supermercado is over budget&lt;/div&gt;&lt;div class=&quot;mh-alert-time&quot;&gt;₡46 175 above this month&#x27;s budget&lt;/div&gt;&lt;span class=&quot;mh-section-link&quot;&gt;View report&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;&lt;/div&gt;&lt;/div&gt;`;
  }

  function render() {
    const screen = screenSelect.value;
    title.textContent = directionInfo[direction].title;
    summary.textContent = directionInfo[direction].summary;
    stage.dataset.theme = themeSelect.value;
    if (screen === &#x27;desktop-home&#x27;) stage.innerHTML = desktopHome();
    if (screen === &#x27;mobile-home&#x27;) stage.innerHTML = mobileHome();
    if (screen === &#x27;mobile-review&#x27;) stage.innerHTML = mobileReview();
    if (screen === &#x27;alerts&#x27;) stage.innerHTML = alertsView();
    if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
  }

  root.querySelectorAll(&#x27;[data-direction]&#x27;).forEach((button) =&gt; {
    button.addEventListener(&#x27;click&#x27;, () =&gt; {
      direction = button.dataset.direction;
      root.querySelectorAll(&#x27;[data-direction]&#x27;).forEach((item) =&gt; {
        const active = item === button;
        item.setAttribute(&#x27;aria-pressed&#x27;, active ? &#x27;true&#x27; : &#x27;false&#x27;);
        item.classList.toggle(&#x27;btn-primary&#x27;, active);
      });
      render();
    });
  });
  stage.addEventListener(&#x27;click&#x27;, (event) =&gt; {
    const toggle = event.target.closest(&#x27;.mh-expense-toggle&#x27;);
    if (toggle) {
      const frame = toggle.closest(&#x27;[data-expense]&#x27;);
      const detail = frame.querySelector(&#x27;.mh-expense-detail&#x27;);
      const expanded = toggle.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
      toggle.setAttribute(&#x27;aria-expanded&#x27;, expanded ? &#x27;false&#x27; : &#x27;true&#x27;);
      detail.hidden = expanded;
      toggle.querySelector(&#x27;.mh-chevron&#x27;).innerHTML = icon(expanded ? &#x27;chevron-down&#x27; : &#x27;chevron-up&#x27;);
      if (window.lucide) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      return;
    }

    const more = event.target.closest(&#x27;[data-see-more]&#x27;);
    if (more) {
      const panel = more.closest(&#x27;.mh-panel&#x27;);
      const older = panel.querySelector(&#x27;.mh-older-expenses&#x27;);
      const expanded = more.getAttribute(&#x27;aria-expanded&#x27;) === &#x27;true&#x27;;
      more.setAttribute(&#x27;aria-expanded&#x27;, expanded ? &#x27;false&#x27; : &#x27;true&#x27;);
      older.hidden = expanded;
      more.textContent = expanded ? &#x27;See more&#x27; : &#x27;See less&#x27;;
    }
  });
  screenSelect.addEventListener(&#x27;change&#x27;, render);
  themeSelect.addEventListener(&#x27;change&#x27;, render);
  render();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;

(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
