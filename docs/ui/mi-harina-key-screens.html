}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  function money(crc,usd){return `&lt;span data-crc=&quot;${crc}&quot; data-usd=&quot;${usd}&quot;&gt;${currency===&#x27;crc&#x27;?crc:usd}&lt;/span&gt;`;}
  function header(mobile){mobile=Boolean(mobile);const w=words[languageControl.value];const nav=mobile?&#x27;&#x27;:`&lt;nav class=&quot;mhk-nav&quot;&gt;&lt;a href=&quot;#&quot; aria-current=&quot;page&quot;&gt;${w.home}&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;${icon(&#x27;list-checks&#x27;)} ${w.review} &lt;b class=&quot;mhk-count&quot;&gt;3&lt;/b&gt;&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;${w.search}&lt;/a&gt;&lt;a href=&quot;#&quot;&gt;${w.reports}&lt;/a&gt;&lt;/nav&gt;`;return `&lt;header class=&quot;mhk-topbar&quot;&gt;&lt;div class=&quot;mhk-brand&quot;&gt;${logo()}&lt;span&gt;MiHarina&lt;/span&gt;&lt;/div&gt;${nav}&lt;div class=&quot;mhk-tools&quot;&gt;&lt;button class=&quot;mhk-add&quot; type=&quot;button&quot;&gt;${icon(&#x27;plus&#x27;)}&lt;span&gt;${w.add}&lt;/span&gt;&lt;/button&gt;&lt;button class=&quot;mhk-tool mhk-mobile-add&quot; type=&quot;button&quot; aria-label=&quot;${w.add}&quot;&gt;${icon(&#x27;plus&#x27;)}&lt;/button&gt;&lt;button class=&quot;mhk-tool mhk-currency&quot; type=&quot;button&quot; aria-label=&quot;Currency&quot;&gt;${currency===&#x27;crc&#x27;?&#x27;₡&#x27;:&#x27;$&#x27;}&lt;/button&gt;&lt;button class=&quot;mhk-tool mhk-theme-toggle&quot; type=&quot;button&quot; aria-label=&quot;Theme&quot;&gt;${icon(stage.dataset.theme===&#x27;light&#x27;?&#x27;moon&#x27;:&#x27;sun&#x27;)}&lt;/button&gt;&lt;button class=&quot;mhk-tool mhk-alert-toggle&quot; type=&quot;button&quot; aria-label=&quot;${w.alerts}&quot;&gt;${icon(&#x27;bell&#x27;)}&lt;/button&gt;&lt;button class=&quot;mhk-tool&quot; type=&quot;button&quot; aria-label=&quot;${w.settings}&quot;&gt;${icon(&#x27;settings&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/header&gt;${alertPanel()}`;}
  function alertPanel(){const w=words[languageControl.value];return `&lt;aside class=&quot;mhk-alert-panel&quot; hidden&gt;&lt;h3&gt;${w.alerts}&lt;/h3&gt;&lt;div class=&quot;mhk-alert&quot;&gt;&lt;span&gt;${icon(&#x27;credit-card&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;${w.payment}&lt;/strong&gt;&lt;small&gt;${w.paymentDetail}&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mhk-alert&quot;&gt;&lt;span&gt;${icon(&#x27;copy&#x27;)}&lt;/span&gt;&lt;div&gt;&lt;strong&gt;${w.duplicate}&lt;/strong&gt;&lt;small&gt;Uber · ${money(&#x27;₡4 250&#x27;,&#x27;$8.34&#x27;)}&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&lt;/aside&gt;`;}

  function expense(name,category,amount,iconName,note,flag,expanded){flag=Boolean(flag);expanded=Boolean(expanded);const w=words[languageControl.value];const flagMarkup=flag?`&lt;em class=&quot;mhk-flag&quot;&gt;${icon(&#x27;copy&#x27;)} ${w.duplicate}&lt;/em&gt;`:&#x27;&#x27;;const hiddenAttribute=expanded?&#x27;&#x27;:&#x27;hidden&#x27;;return `&lt;article class=&quot;mhk-expense&quot; data-expense&gt;&lt;div class=&quot;mhk-expense-row&quot;&gt;&lt;button class=&quot;mhk-expense-toggle&quot; type=&quot;button&quot; aria-expanded=&quot;${expanded}&quot;&gt;&lt;span class=&quot;mhk-category&quot;&gt;${icon(iconName)}&lt;/span&gt;&lt;span class=&quot;mhk-expense-copy&quot;&gt;&lt;strong&gt;${name}&lt;/strong&gt;&lt;span&gt;${category}&lt;/span&gt;${flagMarkup}&lt;/span&gt;&lt;i class=&quot;mhk-chevron&quot; data-lucide=&quot;${expanded?&#x27;chevron-up&#x27;:&#x27;chevron-down&#x27;}&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/button&gt;&lt;strong class=&quot;mhk-amount&quot;&gt;${amount}&lt;/strong&gt;&lt;div class=&quot;mhk-row-actions&quot;&gt;&lt;button type=&quot;button&quot; aria-label=&quot;Edit&quot;&gt;${icon(&#x27;pencil&#x27;)}&lt;/button&gt;&lt;button type=&quot;button&quot; aria-label=&quot;Split&quot;&gt;${icon(&#x27;split&#x27;)}&lt;/button&gt;&lt;button class=&quot;mhk-delete-trigger&quot; type=&quot;button&quot; aria-label=&quot;${w.delete}&quot;&gt;${icon(&#x27;trash-2&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;mhk-expense-detail&quot; ${hiddenAttribute}&gt;&lt;div class=&quot;mhk-detail-primary&quot;&gt;&lt;span&gt;★&lt;/span&gt;&lt;span&gt;VISA&lt;/span&gt;&lt;strong&gt;•••• 0828&lt;/strong&gt;&lt;/div&gt;&lt;p&gt;${note}&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;mhk-confirm&quot; hidden&gt;&lt;span&gt;${w.deleteQuestion}&lt;/span&gt;&lt;button class=&quot;mhk-small-button mhk-cancel-delete&quot; type=&quot;button&quot;&gt;${w.cancel}&lt;/button&gt;&lt;button class=&quot;mhk-small-button mhk-danger&quot; type=&quot;
