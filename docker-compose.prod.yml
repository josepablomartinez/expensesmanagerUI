name: miharina-ui

services:
  web:
    build:
      context: .
      args:
        # Baked into the JS bundle at build time -- must be a URL reachable
        # from the *browser*, not the internal Docker network. This is a
        # different Docker project than the backend stack (see the `web`
        # external network below), so it can't just say "http://expense-api:8080".
        VITE_API_URL: https://api.miharina.co.cr
    container_name: expenses-web
    restart: unless-stopped
    # No "ports:" -- only Traefik (on the shared "web" network) reaches this
    # container, same as expense-api and n8n in the backend stack.
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.expenses-web.rule=Host(`app.miharina.co.cr`)"
      - "traefik.http.routers.expenses-web.entrypoints=websecure"
      - "traefik.http.routers.expenses-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.expenses-web.loadbalancer.server.port=80"

networks:
  web:
    # Backend stack's docker-compose.prod.yml sets `name: miharina` at the
    # top level, so Compose's default network name for its `web` network
    # (declared in docker-compose.yml) is "miharina_web". This stack joins
    # that same network instead of creating its own, so Traefik -- running
    # as part of the backend stack -- can route to this container too.
    external: true
    name: miharina_web
